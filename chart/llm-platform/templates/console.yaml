apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels: {{- include "llm-platform.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: console}
  template:
    metadata:
      labels: {app: console}
    spec:
      containers:
        - name: console
          image: {{ .Values.images.console }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: GATEWAY_URL, value: "http://litellm:4000"}
            - {name: GATEWAY_MODEL, value: {{ .Values.model.alias | quote }}}
            - {name: VLLM_METRICS_URL, value: "{{ include "llm-platform.modelBase" . }}/metrics"}
            - {name: GPU_URL, value: "{{ include "llm-platform.gpuBase" . }}/json"}
            - {name: DATA_DIR, value: /data}
            - name: TENANT_KEYS_JSON
              valueFrom: {secretKeyRef: {name: llm-platform-secrets, key: tenantKeysJson}}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
          volumeMounts: [{name: data, mountPath: /data}]
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {memory: 512Mi}}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: console
spec:
  type: NodePort
  selector: {app: console}
  ports: [{port: 8000, nodePort: {{ .Values.nodePorts.console }}}]
