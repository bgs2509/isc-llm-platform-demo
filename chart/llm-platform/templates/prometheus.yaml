apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: {{- include "llm-platform.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/prometheus-config.yaml") . | sha256sum | trunc 16 }}
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.images.prometheus }}
          imagePullPolicy: IfNotPresent
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3d"]
          ports: [{containerPort: 9090}]
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml}
            - {name: rules, mountPath: /etc/prometheus/rules}
            - {name: litellm-key, mountPath: /etc/prometheus/secrets, readOnly: true}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 768Mi}}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: rules
          configMap: {name: prometheus-rules}
        - name: litellm-key
          secret:
            secretName: llm-platform-secrets
            items: [{key: masterKey, path: masterKey}]
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector: {app: prometheus}
  ports: [{port: 9090}]
