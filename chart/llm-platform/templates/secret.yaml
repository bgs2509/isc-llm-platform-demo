{{- /* Random values are created once and kept across upgrades (looked up from the live Secret). */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "llm-platform-secrets" -}}
{{- $old := dict -}}
{{- if $existing }}{{ range $k, $v := $existing.data }}{{ $_ := set $old $k ($v | b64dec) }}{{ end }}{{ end -}}
{{- $keys := dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: llm-platform-secrets
  labels: {{- include "llm-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  masterKey: {{ get $old "masterKey" | default (printf "sk-%s" (randAlphaNum 32)) | quote }}
  postgresPassword: {{ get $old "postgresPassword" | default (randAlphaNum 24) | quote }}
  grafanaAdminPassword: {{ get $old "grafanaAdminPassword" | default (randAlphaNum 20) | quote }}
  {{- range .Values.tenants }}
  {{- $k := get $old (printf "key-%s" .name) | default (printf "sk-%s-%s" .name (randAlphaNum 24)) }}
  {{- $_ := set $keys .name $k }}
  key-{{ .name }}: {{ $k | quote }}
  {{- end }}
  tenantKeysJson: {{ $keys | toJson | quote }}
